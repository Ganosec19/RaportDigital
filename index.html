d><\/table><\/div><\/div><\/section>\n<section id=t2 hidden>\n<div class=card><details><summary>1. Data Sekolah, Logo &amp; Tanda Tangan<\/summary><div id=sch><\/div><\/details><\/div>\n<div class=card><details open><summary>2. Mapel, KKM &amp; Deskripsi Capaian<\/summary><div id=mp><\/div><\/details><\/div>\n<div class=card><details><summary>3. Ekstrakurikuler (per kelas)<\/summary><div id=ek><\/div><\/details><\/div>\n<div class=card><b>4. Nilai, Ketidakhadiran &amp; Catatan<\/b> <span id=cn2><\/span><p style=\"font-size:12px;margin:4px 0\">Nama dan NISN terhubung dari Database Siswa. Klik sel mapel baris pertama lalu tempel (Ctrl+V) kolom dari Excel; kolom boleh banyak sekaligus (mapel, Izin, Sakit, Alpa, Catatan). Mapel kosong tidak tercetak. Deskripsi capaian, predikat, rata-rata, catatan wali kelas, dan keputusan naik kelas dibuat otomatis.<\/p><details><summary>Tempel manual (untuk HP)<\/summary>Mulai dari kolom: <select id=tc><\/select><textarea id=tpn rows=4 style=\"width:100%\" placeholder=\"Tempel kolom nilai dari Excel di sini; baris pertama = siswa nomor 1.\"><\/textarea><button onclick=tempelN()>Isi ke tabel nilai<\/button><\/details><div class=sc><table id=g><\/table><\/div><\/div>\n<div class=card><b>5. Cetak<\/b><br>Siswa: <select id=who><\/select> <label><input type=checkbox id=p1 checked>Cover<\/label><label><input type=checkbox id=p2 checked>Identitas Sekolah<\/label><label><input type=checkbox id=p3 checked>Keterangan Diri<\/label><label><input type=checkbox id=p4 checked>Nilai (2 halaman)<\/label><label><input type=checkbox id=p5 checked>Watermark logo<\/label><br><button onclick=prev()>Pratinjau<\/button> <button onclick=pdf()>Unduh PDF<\/button> <button onclick=cetak()>Cetak<\/button> <span id=pst style=\"font-size:12px\"><\/span><\/div>\n<\/section>\n<section id=t3 hidden><div class=card><b>Rekap Nilai &amp; Peringkat<\/b> <span id=cn3><\/span><p style=\"font-size:12px;margin:4px 0\">Menurut kelas dan semester yang dipilih di atas. &quot;Bel let cur=null,timer=null,wk=null,last='',dirty=false;
$('pw').placeholder='Kata sandi (min. 6 karakter)';
const lp=document.createElement('button');lp.className='out';lp.textContent='Lupa kata sandi?';lp.onclick=async()=>{const e=$('em').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return alert('Isi email Anda dulu di kolom Email.');try{await A.sendPasswordResetEmail(au,e);alert('Tautan atur ulang kata sandi sudah dikirim ke '+e+' (cek juga folder Spam).')}catch(x){bad(x)}};
$('go').after(lp);
window.kirim=async()=>{const e=$('em').value.trim().toLowerCase(),p=$('pw').value;if(!/^\S+@\S+\.\S+$/.test(e))return alert('Email tidak valid');if(p.length<6)return alert('Kata sandi minimal 6 karakter');
 try{if(mode=='daftar'){const n=$('nm').value.trim();if(!n)return alert('Isi nama lengkap');const c=await A.createUserWithEmailAndPassword(au,e,p);await A.updateProfile(c.user,{displayName:n});
  await F.setDoc(F.doc(db,'users',c.user.uid),{nama:n,email:e,createdAt:F.serverTimestamp(),lastLogin:F.serverTimestamp()});A.sendEmailVerification(c.user).catch(()=>{});showMenu(c.user)}
 else await A.signInWithEmailAndPassword(au,e,p)}catch(x){bad(x)}};
window.setMode=m=>{mode=m;$('tD').className=m=='daftar'?'on':'';$('tM').className=m=='masuk'?'on':'';$('nm').hidden=m!='daftar';$('go').textContent=m=='daftar'?'Daftar Sekarang':'Masuk'};
function showMenu(u){cur=u;localStorage.setItem('gdi_sess',em(u));$('vL').hidden=true;$('vM').hidden=false;$('hi').textContent='Halo, '+(u.displayName||em(u))+'!';
 $('mn').innerHTML=PK.map(([f,a,b])=>`<a href="#" onclick="openR('${f}');return false">${a}<small>${b}</small></a>`).join('')+(isAdm(u)?'<a href="#" onclick="adminOpen();return false">Panel Admin<small>Daftar pengguna &amp; kirim reset sandi</small></a>':'')}
A.onAuthStateChanged(au,async u=>{window.FB_AUTH=1;if(u){showMenu(u);F.updateDoc(F.doc(db,'users',u.uid),{lastLogin:F.serverTimestamp()}).catch(()=>{})}else{cur=null;$('vL').hidden=false;$('vM').hidden=true}});
const KO={a:'rapor_a',b:'rapor_b',cipa:'rapor_cipa',cips:'rapor_cips'},LK=(k)=>KO[k]+'_'+em(cur),TK=k=>'fb_ts_'+cur.uid+'_'+k,DK=k=>'fb_dirty_'+cur.uid+'_'+k,CH=400000;
const ref=(k,s)=>F.doc(db,'users',cur.uid,'rapor',s?k+'_c'+s:k);
async function pull(k){const lk=LK(k),loc=localStorage.getItem(lk),m=await F.getDoc(ref(k));
 if(!m.exists()){if(loc)await push(k);return}
 const md=m.data(),lt=+localStorage.getItem(TK(k))||0;
 if(loc&&localStorage.getItem(DK(k))=='1'&&md.ts>lt&&!confirm('Ada perubahan di perangkat ini yang belum terkirim ke cloud, padahal data cloud lebih baru.\n\nOK = pakai data perangkat ini\nBatal = pakai data cloud'))localStorage.removeItem(DK(k));
 if(localStorage.getItem(DK(k))=='1'){await push(k);return}
 if(loc&&md.ts<=lt)return;
 let t='';for(let i=1;i<=md.n;i++)t+=(await F.getDoc(ref(k,i))).data().t;
 localStorage.setItem(lk,t);localStorage.setItem(TK(k),String(md.ts))}
async function push(k){const t=localStorage.getItem(LK(k));if(!t)return;const n=Math.ceil(t.length/CH),ts=Date.now(),b=F.writeBatch(db);
 for(let i=1;i<=n;i++)b.set(ref(k,i),{t:t.slice((i-1)*CH,i*CH)});b.set(ref(k),{n,ts,bytes:t.length});await b.commit();
 localStorage.setItem(TK(k),String(ts));localStorage.removeItem(DK(k));last=t;const s=document.getElementById('fr')?.contentDocument?.getElementById('st');if(s)s.textContent='\u2601 Tersimpan di cloud '+new Date().toTimeString().slice(0,5)}
function watch(k){clearInterval(wk);last=localStorage.getItem(LK(k))||'';let seen=last,pend=false;
 wk=setInterval(async()=>{const t=localStorage.getItem(LK(k))||'';if(t!==last&&t!==seen){seen=t;pend=true;localStorage.setItem(DK(k),'1');return}
  if(pend&&t===seen&&t!==last){pend=false;try{await push(k)}catch(x){pend=true}}},5000)}
let ck=null;
window.openR=async k=>{const o=document.createElement('div');o.id='fbl';o.style.cssText='position:fixed;inset:0;background:#0b1020e0;color:#fff;display:flex;align-items:center;justify-content:center;z-index:98;font:600 16px system-ui';o.textContent='Memuat data dari cloud\u2026';document.body.appendChild(o);
 try{await pull(k)}catch(x){alert('Gagal terhubung ke Gannos Digital Indonesia, memakai data di perangkat ini. ('+(x.code||x.message)+')')}o.remove();ck=k;
 const f=document.createElement('iframe');f.id='fr';f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:99';f.srcdoc=R[k].split('__LOGO__').join(LOGO);document.body.appendChild(f);document.body.style.overflow='hidden';watch(k)};
window.closeR=async o=>{clearInterval(wk);const f=document.getElementById('fr');if(f)f.remove();document.body.style.overflow='';
 if(ck&&cur){try{if(localStorage.getItem(DK(ck))=='1'||(localStorage.getItem(LK(ck))||'')!==last)await push(ck)}catch(x){}}ck=null;
 if(o){await A.signOut(au);location.reload()}};
window.keluar=async()=>{await A.signOut(au);location.reload()};
window.adminOpen=async()=>{if(!cur||!isAdm(cur))return;const d=document.createElement('div');d.id='adm';d.style.cssText='position:fixed;inset:0;background:#0b1020f2;z-index:98;overflow:auto;padding:20px;color:#fff';
 d.innerHTML='<div style="max-width:900px;margin:auto"><button class="out" onclick="document.getElementById(\'adm\').remove()">&larr; Kembali</button><h2>Pengguna terdaftar <span id=ac></span></h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:14px" id=at><tr><td>Memuat\u2026</td></tr></table></div></div>';document.body.appendChild(d);
 try{const q=await F.getDocs(F.query(F.collection(db,'users'),F.orderBy('createdAt','desc')));const fm=v=>v&&v.toDate?v.toDate().toLocaleString('id-ID'):'-',rows=[];q.forEach(s=>rows.push(s.data()));
  $('ac').textContent='('+rows.length+')';$('at').innerHTML='<tr style="text-align:left;background:#ffffff22"><th style="padding:8px">Nama</th><th>Email</th><th>Daftar</th><th>Terakhir masuk</th><th></th></tr>'+rows.map(r=>`<tr style="border-top:1px solid #ffffff33"><td style="padding:8px">${esc(r.nama)}</td><td>${esc(r.email)}</td><td>${fm(r.createdAt)}</td><td>${fm(r.lastLogin)}</td><td><button class="go" style="margin:4px;padding:6px 10px;font-size:13px" data-e="${esc(r.email)}">Kirim reset sandi</button></td></tr>`).join('');
  $('at').querySelectorAll('button[data-e]').forEach(b=>b.onclick=async()=>{try{await A.sendPasswordResetEmail(au,b.dataset.e);b.textContent='Terkirim \u2714'}catch(x){bad(x)}})}catch(x){$('at').innerHTML='<tr><td>Gagal memuat: '+(x.code||x.message)+'</td></tr>'}};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
</script>
</body></html>
